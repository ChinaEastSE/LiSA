<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LiSA · Access</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

  .scene{position:fixed;inset:0;overflow:hidden;transform:translateZ(0)}

  .layer{position:absolute}
  .layer img{width:100%;height:100%;display:block;transform:translateZ(0)}

  /* Layer 1 — Earth */
  .layer-1{inset:-15%;width:130%;height:130%;z-index:1;transform:translateZ(0)}
  .layer-1 img{object-fit:cover}

  /* Starship */
  .layer-ship{z-index:5;width:800px;height:800px;left:20px;top:20px;transform:scale(.75) translateZ(0)}
  .layer-ship img{object-fit:contain}

  /* Layer 2 — Mars window */
  .layer-2{inset:-15%;width:130%;height:130%;z-index:10;transform:translateZ(0)}
  .layer-2 img{object-fit:cover}

  /* LISA title */
  .layer-text{inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateZ(0)}
  .lisa-title{display:flex;font-size:clamp(80px,18vw,200px);font-weight:800;color:#fff;line-height:1;letter-spacing:.02em}
  .lisa-title span{display:inline-block}
  .lisa-sub{margin-top:16px;color:rgba(255,255,255,.6);font-size:clamp(11px,1.4vw,16px);letter-spacing:.35em;text-transform:uppercase;font-weight:300;opacity:0}

  /* Layer 3 — astronaut */
  .layer-3{inset:-5%;width:110%;height:110%;top:calc(-5% + 150px);z-index:20;transform:translateZ(0)}
  .layer-3 img{object-fit:cover}

  /* ===== Optimized entrance animations (GPU-only: transform + opacity) ===== */
  .animate .layer-1{animation:z1 2.5s cubic-bezier(.4,0,.2,1) forwards}
  .animate .layer-ship{animation:zShip 2.5s cubic-bezier(.4,0,.2,1) forwards}
  .animate .layer-2{animation:z2 2.5s cubic-bezier(.4,0,.2,1) forwards}
  .animate .layer-3{animation:z3 2.5s cubic-bezier(.4,0,.2,1) forwards}
  .animate .layer-text{animation:zText 2s cubic-bezier(.4,0,.2,1) forwards}
  .animate .lisa-title span{animation:rot 2.5s cubic-bezier(.4,0,.2,1) forwards}
  .animate .lisa-sub{animation:fadeSub 1s 1.5s cubic-bezier(.4,0,.2,1) forwards}

  @keyframes z1{0%{transform:scale(1.3) translateZ(0)}100%{transform:scale(1) translateZ(0)}}
  @keyframes zShip{0%{transform:scale(1.5) translateZ(0)}100%{transform:scale(.75) translateZ(0)}}
  @keyframes z2{0%{transform:scale(2.5) translateZ(0);opacity:.7}100%{transform:scale(1) translateZ(0);opacity:1}}
  @keyframes z3{0%{transform:scale(8) translateZ(0);opacity:0}40%{opacity:.5}100%{transform:scale(1) translateZ(0);opacity:1}}
  @keyframes zText{0%{transform:scale(2.5) translateZ(0);opacity:0}60%{opacity:.6}100%{transform:scale(1) translateZ(0);opacity:1}}
  @keyframes rot{0%{transform:rotateY(90deg) translateZ(0);opacity:0}50%{opacity:.6}100%{transform:rotateY(0) translateZ(0);opacity:1}}
  @keyframes fadeSub{0%{opacity:0;transform:translateY(10px) translateZ(0)}100%{opacity:1;transform:translateY(0) translateZ(0)}}

  /* ===== Login overlay — visible immediately ===== */
  .login-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .5s ease}
  .login-wrap.show{opacity:1;pointer-events:auto}
  .login-wrap.hide{opacity:0;pointer-events:none}

  .login-dim{position:absolute;inset:0;background:rgba(0,0,0,.4);transition:opacity .5s}
  .login-wrap.hide .login-dim{opacity:0}

  .login-card{position:relative;width:100%;max-width:380px;border-radius:18px;border:1px solid rgba(255,255,255,.15);
    background:rgba(20,22,35,.85);padding:36px 32px;box-shadow:0 20px 80px -20px rgba(0,0,0,.8);transition:opacity .5s;
    transform:translateZ(0)}
  .login-wrap.hide .login-card{opacity:0}
  .login-card.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}

  .lock-icon{width:40px;height:40px;margin:0 auto 16px;border:1px solid rgba(255,255,255,.2);border-radius:50%;
    background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8)}
  .lock-icon svg{width:18px;height:18px}

  .login-title{text-align:center;color:#fff;font-size:18px;font-weight:600;letter-spacing:.02em}
  .login-hint{text-align:center;color:rgba(255,255,255,.5);font-size:12px;margin-top:6px;letter-spacing:.08em}

  .pwd-input{width:100%;margin-top:24px;border-radius:12px;border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.3);padding:14px 16px;color:#fff;font-size:18px;text-align:center;letter-spacing:.4em;
    outline:none;transition:border-color .2s,background .2s}
  .pwd-input::placeholder{color:rgba(255,255,255,.25);letter-spacing:.4em}
  .pwd-input:focus{border-color:rgba(103,232,249,.6);background:rgba(0,0,0,.4)}
  .pwd-input.err{border-color:rgba(248,113,113,.6)}

  .err-msg{text-align:center;color:#f87171;font-size:12px;margin-top:10px;letter-spacing:.04em;height:16px}

  .enter-btn{width:100%;margin-top:18px;border:none;border-radius:12px;cursor:pointer;
    background:linear-gradient(90deg,rgba(34,211,238,.9),rgba(59,130,246,.9));color:#000;
    padding:14px;font-size:14px;font-weight:600;letter-spacing:.08em;transition:all .2s}
  .enter-btn:hover{background:linear-gradient(90deg,rgba(103,232,249,1),rgba(96,165,250,1))}
  .enter-btn:active{transform:scale(.98)}
  .enter-btn:disabled{opacity:.5;cursor:default}

  .foot-note{text-align:center;color:rgba(255,255,255,.3);font-size:10px;letter-spacing:.3em;text-transform:uppercase;margin-top:20px}

  /* Unlock flash */
  .flash{position:fixed;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
  .flash.on{opacity:.85}

  @keyframes shake{
    10%,90%{transform:translateX(-1px)}
    20%,80%{transform:translateX(2px)}
    30%,50%,70%{transform:translateX(-4px)}
    40%,60%{transform:translateX(4px)}
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <!-- Layer 1 -->
  <div class="layer layer-1" id="l1">
    <img src="martian-parallax-experience/public/images/earth-1-opt.jpg" alt="">
  </div>
  <!-- Starship -->
  <div class="layer layer-ship" id="lShip">
    <img src="martian-parallax-experience/public/images/starship_lenovo.jpg" alt="">
  </div>
  <!-- Layer 2 -->
  <div class="layer layer-2" id="l2">
    <img src="martian-parallax-experience/public/images/mars-2.jpg" alt="">
  </div>
  <!-- LISA title -->
  <div class="layer layer-text" id="lText">
    <div class="lisa-title" id="titleWrap"></div>
    <div class="lisa-sub">Lenovo Intelligent Storage Agent</div>
  </div>
  <!-- Layer 3 -->
  <div class="layer layer-3" id="l3">
    <img src="martian-parallax-experience/public/images/mars-3.jpg" alt="">
  </div>
</div>

<!-- Login overlay — shown immediately -->
<div class="login-wrap show" id="loginWrap">
  <div class="login-dim"></div>
  <form class="login-card" id="loginCard" autocomplete="off">
    <!-- 隐藏的假字段，骗浏览器自动填充到这里 -->
    <input type="text" name="username" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1" autocomplete="off">
    <input type="password" name="password" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1" autocomplete="off">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <div class="login-title">Access Required</div>
    <div class="login-hint">Enter access code to continue</div>
    <input class="pwd-input" id="pwd" type="password" placeholder="••••••" autocomplete="new-password" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')">
    <div class="err-msg" id="errMsg"></div>
    <button class="enter-btn" id="enterBtn" type="submit">Enter</button>
    <div class="foot-note">LiSA · Confidential</div>
  </form>
</div>

<div class="flash" id="flash"></div>

<script>
(function(){
  var PWD = "EASTSE";

  var titleWrap = document.getElementById("titleWrap");
  "LISA".split("").forEach(function(ch,i){
    var s=document.createElement("span");
    s.textContent=ch;
    s.style.animationDelay=(i*0.08)+"s";
    titleWrap.appendChild(s);
  });

  var scene=document.getElementById("scene");
  // Start entrance animation on next frame (ensure CSS is applied)
  requestAnimationFrame(function(){
    scene.classList.add("animate");
  });

  // ===== Throttled parallax with requestAnimationFrame =====
  var mx=0,my=0,targetMx=0,targetMy=0;
  var l1=document.getElementById("l1"),lShip=document.getElementById("lShip"),
      l2=document.getElementById("l2"),lText=document.getElementById("lText"),l3=document.getElementById("l3");
  var parallaxRunning=false;

  function onMove(e){
    targetMx=(e.clientX-window.innerWidth/2)/window.innerWidth;
    targetMy=(e.clientY-window.innerHeight/2)/window.innerHeight;
    if(!parallaxRunning){
      parallaxRunning=true;
      requestAnimationFrame(applyParallax);
    }
  }
  function applyParallax(){
    // Smooth interpolation for buttery feel
    mx += (targetMx-mx)*0.1;
    my += (targetMy-my)*0.1;
    l1.style.transform="translate3d("+(mx*30)+"px,"+(my*30)+"px,0)";
    lShip.style.transform="translate3d("+(mx*50)+"px,"+(my*50)+"px,0) scale(0.75)";
    l2.style.transform="translate3d("+(mx*60)+"px,"+(my*60)+"px,0)";
    lText.style.transform="translate3d("+(mx*90)+"px,"+(my*90)+"px,0)";
    l3.style.transform="translate3d("+(mx*120)+"px,"+(my*120)+"px,0)";
    if(Math.abs(targetMx-mx)>0.0001||Math.abs(targetMy-my)>0.0001){
      requestAnimationFrame(applyParallax);
    }else{
      parallaxRunning=false;
    }
  }
  if(!("ontouchstart" in window)){
    window.addEventListener("mousemove",onMove,{passive:true});
  }

  // ===== Login — already shown, just focus on next frame =====
  var loginWrap=document.getElementById("loginWrap");
  var pwd=document.getElementById("pwd");
  var errMsg=document.getElementById("errMsg");
  var enterBtn=document.getElementById("enterBtn");
  var loginCard=document.getElementById("loginCard");
  var flash=document.getElementById("flash");
  var unlocked=false;

  requestAnimationFrame(function(){
    pwd.focus();
  });

  loginCard.addEventListener("submit",function(e){
    e.preventDefault();
    if(unlocked) return;
    var val=pwd.value.trim().toUpperCase();
    if(val===PWD){
      unlocked=true;
      enterBtn.textContent="Access Granted";
      enterBtn.disabled=true;
      errMsg.textContent="";
      try{ sessionStorage.setItem("lisa-auth","1"); }catch(_){}
      loginWrap.classList.add("hide");
      flash.classList.add("on");
      setTimeout(function(){ window.location.href="index.html"; },900);
    }else{
      errMsg.textContent="Incorrect access code. Please try again.";
      pwd.classList.add("err");
      loginCard.classList.add("shake");
      pwd.value="";
      setTimeout(function(){ loginCard.classList.remove("shake"); },500);
      setTimeout(function(){ pwd.classList.remove("err"); },1500);
    }
  });

  pwd.addEventListener("input",function(){
    if(errMsg.textContent){ errMsg.textContent=""; pwd.classList.remove("err"); }
  });
})();
</script>
</body>
</html>
